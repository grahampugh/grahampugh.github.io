---
layout: default
---

<div class="post">
  <h1 class="post-title">{{ page.title }}</h1>

  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%b %-d, %Y" }}</time>
  </p>

  {% if page.tags %}
  <p class="post-meta post-tags"><b>Tags:</b> 
    {% for tag in page.tags %}
      <a href="#tag-{{ tag | slugify }}" class="tag-filter-link" data-tag="{{ tag | slugify }}">[ {{ tag | capitalize }} ]</a> 
    {% endfor %}
  </p>
  {% endif %}

  {{ content }}

  <script src="https://giscus.app/client.js"
        data-repo="grahampugh/grahampugh.github.io"
        data-repo-id="MDEwOlJlcG9zaXRvcnk0NjYzMTE3Mg=="
        data-category="General"
        data-category-id="DIC_kwDOAseJBM4CzFg7"
        data-mapping="title"
        data-strict="1"
        data-reactions-enabled="1"
        data-emit-metadata="1"
        data-input-position="top"
        data-theme="light"
        data-lang="en"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
    </script>

</div>
